<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект на GitHub</title>
    <style>
        /* Общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Карточка */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        /* Аватар */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* Заголовки */
        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }
        
        /* Описание */
        .description {
            text-align: center;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        /* Кнопки */
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-around;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .stat-label {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }
        
        /* Адаптивность */
        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Аватар -->
        <div class="avatar">🚀</div>
        
        <!-- Информация -->
        <h1>Мой проект</h1>
        <p class="subtitle">✨ Инновационный веб-проект</p>
        
        <p class="description">
            Современный проект с использованием передовых технологий. 
            Открытый исходный код для сообщества.
        </p>
        
        <!-- Кнопки -->
        <div class="buttons">
            <a href="#" class="btn btn-primary">
                📂 Репозиторий
            </a>
            <a href="#" class="btn btn-secondary">
                📖 Документация
            </a>
        </div>
        
        <!-- Статистика -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">⭐ 42</div>
                <div class="stat-label">Звёзды</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">🍴 7</div>
                <div class="stat-label">Форки</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">👥 12</div>
                <div class="stat-label">Контрибьюторы</div>
            </div>
        </div>
    </div>
</body>
</html>
