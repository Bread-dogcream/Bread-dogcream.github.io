<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт + Галерея</title>
  <!-- Подключаем шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ---------- ОБЩИЕ СТИЛИ ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #1e293b;
      line-height: 1.6;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Контейнер для двух блоков */
    .app-wrapper {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }

    /* ---------- КАРТОЧКА-ВИЗИТКА (из первого файла) ---------- */
    .card {
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.25s ease;
      text-align: center;
      margin: 0 auto;
    }

    .card:hover {
      box-shadow: 0 30px 50px -16px rgba(0, 0, 0, 0.15);
    }

    .avatar {
      width: 88px;
      height: 88px;
      background: linear-gradient(145deg, #3b82f6, #6366f1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
      font-size: 2.4rem;
      font-weight: 600;
      color: white;
      box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.3);
    }

    .card h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: #0f172a;
    }

    .subhead {
      font-size: 1.1rem;
      font-weight: 400;
      color: #475569;
      margin-bottom: 1.8rem;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 1.2rem;
    }

    .card p {
      font-size: 1rem;
      color: #334155;
      margin-bottom: 1.2rem;
    }

    .highlight {
      background: #eef6ff;
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      display: inline-block;
      font-weight: 500;
      color: #2563eb;
    }

    .btn {
      display: inline-block;
      background: #1e293b;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.8rem 2.2rem;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 1rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: #0f172a;
      transform: scale(1.02);
      box-shadow: 0 10px 20px -8px rgba(15, 23, 42, 0.25);
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .counter-box {
      margin-top: 2rem;
      padding: 1rem 1.2rem;
      background: #f8fafc;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.95rem;
      border: 1px solid #e2e8f0;
    }

    .counter-box span {
      font-weight: 700;
      font-size: 1.4rem;
      min-width: 2.4rem;
      color: #2563eb;
    }

    .card-footer {
      margin-top: 2.8rem;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 0.3px;
      border-top: 1px solid #e9edf2;
      padding-top: 1.6rem;
      width: 100%;
      text-align: center;
    }

    .card-footer a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* ---------- ГАЛЕРЕЯ (из второго файла) ---------- */
    .gallery-container {
      max-width: 750px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2rem 1.8rem 1.8rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .gallery-container h2 {
      font-size: 1.8rem;
      font-weight: 600;
      text-align: center;
      color: #0b1a33;
      letter-spacing: -0.3px;
      margin-bottom: 1.5rem;
    }

    .main-image-box {
      position: relative;
      width: 100%;
      background: #eef2f7;
      border-radius: 1.5rem;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    }

    #mainImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      font-size: 1.6rem;
      font-weight: 300;
      color: #1a2b44;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .nav-btn:hover {
      background: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.92);
    }

    .prev-btn {
      left: 12px;
    }

    .next-btn {
      right: 12px;
    }

    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 1.8rem;
      padding: 0.2rem 0.2rem;
    }

    .thumb {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
      background: #dce2ea;
    }

    .thumb:hover {
      transform: scale(1.04);
      border-color: #8aa3c9;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .thumb.active {
      border-color: #1f4e8a;
      box-shadow: 0 0 0 3px rgba(31, 78, 138, 0.25);
      transform: scale(1.02);
    }

    .image-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      padding: 0.4rem 0.2rem 0;
      font-size: 0.95rem;
      color: #2c3e5a;
      border-top: 1px solid #e2eaf2;
      padding-top: 1rem;
    }

    .image-counter {
      font-weight: 500;
      background: #eef3f9;
      padding: 0.25rem 1rem;
      border-radius: 30px;
      font-size: 0.9rem;
    }

    .image-title {
      font-weight: 500;
      color: #0b1a33;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- АДАПТИВНОСТЬ ---------- */
    @media (max-width: 550px) {
      .card {
        padding: 2rem 1.5rem;
      }
      .card h1 {
        font-size: 1.8rem;
      }
      .avatar {
        width: 72px;
        height: 72px;
        font-size: 2rem;
      }
      .gallery-container {
        padding: 1.2rem 1rem 1.2rem;
        border-radius: 1.5rem;
      }
      .thumb {
        width: 60px;
        height: 60px;
      }
      .nav-btn {
        width: 38px;
        height: 38px;
        font-size: 1.2rem;
      }
      .prev-btn {
        left: 6px;
      }
      .next-btn {
        right: 6px;
      }
      .gallery-container h2 {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 400px) {
      .thumb {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      .image-title {
        max-width: 120px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- ===== БЛОК 1: ВИЗИТКА (из первого файла) ===== -->
  <div class="card">
    <div class="avatar">✨</div>
    <h1>Привет, мир!</h1>
    <div class="subhead">Это простой сайт на HTML</div>

    <p>
      Здесь живёт <span class="highlight">интерактивная кнопка</span> 
      и немного вдохновения. Никаких лишних сложностей — простота и стиль.
    </p>

    <p>
      Нажми на кнопку — и она ответит тебе!
    </p>

    <button class="btn" id="actionButton">✨ Нажми меня</button>

    <div class="counter-box">
      <span>👆</span>
      Нажатий: <span id="clickCounter">0</span>
    </div>

    <div class="card-footer">
      Сделано с ❤️ на чистом HTML · <a href="#" id="resetLink">Сбросить счётчик</a>
    </div>
  </div>

  <!-- ===== БЛОК 2: ГАЛЕРЕЯ (из второго файла) ===== -->
  <div class="gallery-container">
    <h2>🖼️ Галерея</h2>

    <div class="main-image-box">
      <img id="mainImage" src="https://picsum.photos/id/1015/600/400" alt="Главное изображение">
      
      <button class="nav-btn prev-btn" id="prevBtn" aria-label="Предыдущее">‹</button>
      <button class="nav-btn next-btn" id="nextBtn" aria-label="Следующее">›</button>
    </div>

    <div class="thumbnails" id="thumbnailsContainer"></div>

    <div class="image-info">
      <span class="image-title" id="imageTitle">Горный пейзаж</span>
      <span class="image-counter" id="imageCounter">1 / 8</span>
    </div>
  </div>

</div>

<script>
  // ============================================================
  // 1. СКРИПТ ДЛЯ ВИЗИТКИ (кнопка + счётчик)
  // ============================================================
  (function() {
    const button = document.getElementById('actionButton');
    const counterDisplay = document.getElementById('clickCounter');
    const resetLink = document.getElementById('resetLink');

    let clickCount = 0;

    function updateCounter() {
      counterDisplay.textContent = clickCount;
    }

    function handleButtonClick() {
      clickCount += 1;
      updateCounter();

      button.style.backgroundColor = '#2563eb';
      setTimeout(() => {
        button.style.backgroundColor = '#1e293b';
      }, 150);

      if (clickCount >= 5) {
        button.textContent = '🔥 Супер!';
      } else if (clickCount >= 3) {
        button.textContent = '👍 Так держать!';
      } else {
        button.textContent = '✨ Нажми меня';
      }
    }

    function resetCounter() {
      clickCount = 0;
      updateCounter();
      button.textContent = '✨ Нажми меня';
      button.style.backgroundColor = '#1e293b';
      button.style.transform = 'scale(0.96)';
      setTimeout(() => {
        button.style.transform = 'scale(1)';
      }, 150);
    }

    button.addEventListener('click', handleButtonClick);

    resetLink.addEventListener('click', function(e) {
      e.preventDefault();
      resetCounter();
    });

    // Двойной клик по заголовку сбрасывает счётчик
    const title = document.querySelector('.card h1');
    if (title) {
      title.addEventListener('dblclick', function() {
        resetCounter();
        this.style.color = '#2563eb';
        setTimeout(() => {
          this.style.color = '#0f172a';
        }, 300);
      });
    }

    updateCounter();
    console.log('✨ Визитка загружена');
  })();


  // ============================================================
  // 2. СКРИПТ ДЛЯ ГАЛЕРЕИ
  // ============================================================
  (function() {
    const images = [
      { id: '1015', title: 'Горный пейзаж' },
      { id: '1016', title: 'Дорога в лесу' },
      { id: '1018', title: 'Горное озеро' },
      { id: '1020', title: 'Собака на лугу' },
      { id: '1024', title: 'Птица на ветке' },
      { id: '1027', title: 'Человек в горах' },
      { id: '1035', title: 'Водопад' },
      { id: '1039', title: 'Закат в лесу' }
    ];

    const BASE_URL = 'https://picsum.photos/id/';
    const IMG_WIDTH = 600;
    const IMG_HEIGHT = 400;

    const mainImage = document.getElementById('mainImage');
    const thumbContainer = document.getElementById('thumbnailsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const imageTitle = document.getElementById('imageTitle');
    const imageCounter = document.getElementById('imageCounter');

    let currentIndex = 0;

    function updateGallery(index) {
      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;
      currentIndex = index;

      const imageData = images[currentIndex];
      const imageUrl = `${BASE_URL}${imageData.id}/${IMG_WIDTH}/${IMG_HEIGHT}`;

      mainImage.style.opacity = '0.6';
      setTimeout(() => {
        mainImage.src = imageUrl;
        mainImage.alt = imageData.title;
        mainImage.style.opacity = '1';
      }, 120);

      imageTitle.textContent = imageData.title;
      imageCounter.textContent = `${currentIndex + 1} / ${images.length}`;

      const thumbs = document.querySelectorAll('.thumb');
      thumbs.forEach((thumb, i) => {
        thumb.classList.toggle('active', i === currentIndex);
      });

      const activeThumb = thumbs[currentIndex];
      if (activeThumb) {
        activeThumb.scrollIntoView({ block: 'nearest', behavior: 'smooth', inline: 'center' });
      }
    }

    function renderThumbnails() {
      thumbContainer.innerHTML = '';
      images.forEach((img, idx) => {
        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.src = `${BASE_URL}${img.id}/200/150`;
        thumb.alt = img.title;
        thumb.loading = 'lazy';
        thumb.dataset.index = idx;

        if (idx === 0) thumb.classList.add('active');

        thumb.addEventListener('click', function() {
          const index = parseInt(this.dataset.index, 10);
          updateGallery(index);
        });

        thumbContainer.appendChild(thumb);
      });
    }

    function handlePrev() {
      updateGallery(currentIndex - 1);
    }

    function handleNext() {
      updateGallery(currentIndex + 1);
    }

    function initGallery() {
      renderThumbnails();
      updateGallery(0);

      prevBtn.addEventListener('click', handlePrev);
      nextBtn.addEventListener('click', handleNext);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          handlePrev();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          handleNext();
        }
      });

      mainImage.addEventListener('error', function() {
        this.src = 'https://picsum.photos/seed/fallback/600/400';
        this.alt = 'Изображение недоступно';
      });

      console.log('🖼️ Галерея загружена, изображений:', images.length);
    }

    initGallery();
  })();
</script>

</body>
</html>
